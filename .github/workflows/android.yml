name: Android Standalone APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ABI_FILTERS: arm64-v8a

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # The runner has ~14 GB free; the SDK, NDK, submodules and native intermediates need more.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia*
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # Drop the other preinstalled NDKs (several GB each).
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$ANDROID_NDK_VERSION" -exec sudo rm -rf {} +
          df -h /

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # CMake (>= 3.17) picks the compiler launcher up from these variables.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-${{ env.ABI_FILTERS }}
          max-size: 3G
      - name: Configure ccache for the NDK build
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      # Without the secrets (e.g. pull requests from forks) the APK is signed with the public
      # sample keystore in TMessagesProj/config: fine for testing, never for distribution.
      - name: Prepare signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; signing with the public sample keystore."
            echo "SIGNING=sample" >> "$GITHUB_ENV"
          fi

      - name: Build Standalone APK (${{ env.ABI_FILTERS }})
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SIGNING_ARGS=()
          if [ "$SIGNING" = "release" ]; then
            SIGNING_ARGS=(
              "-PRELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              "-PRELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              "-PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              "-PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            )
          fi
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            "-PABI_FILTERS=$ABI_FILTERS" "${SIGNING_ARGS[@]}" --stacktrace
          ccache --show-stats || true

      - name: Name the APK
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk \
            "dist/Telegram-${VERSION}-${CODE}-${ABI_FILTERS}-${SIGNING}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ env.ABI_FILTERS }}-${{ env.SIGNING }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
